version: '3'

services:
  caddy:
    image: viniciusgue/micro-caddy:1.0.2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-1
    ports:
      - "8000:8000"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mynetwork

  broker-service:
    image: viniciusgue/broker-service:1.0.0
    ports:
      - "9090:9090"
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - mynetwork

  listener-service:
    image: viniciusgue/listener-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - mynetwork

  authentication-service:
    image: viniciusgue/authentication-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: "host=postgres port=5432 user=postgres password=password dbname=users sslmode=disable timezone=UTC connect_timeout=5"
    networks:
      - mynetwork

  logger-service:
    image: viniciusgue/logger-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - mynetwork

  mail-service:
    image: viniciusgue/mail-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      MAIL_DOMAIN: localhost
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: "none"
      MAIL_FROM_NAME: "Mail Service"
      MAIL_FROM_ADDRESS: "mail-service@localhost"
    networks:
      - mynetwork
  
  frontend:
    image: viniciusgue/frontend:1.0.4
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - mynetwork

  rabbitmq:
    image: 'rabbitmq:4.0.5-alpine'
    deploy:
      mode: replicated
      replicas: 1
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - mynetwork

  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - "8025:8025"
    deploy:
      mode: replicated
      replicas: 1
    networks:
      - mynetwork

  mongo:
    image: 'mongo:4.4'
    ports:
      - "27017:27017"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-1
    environment:
      MONGO_INITDB_DATABASE: logs
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password  
    volumes:
      - ./database/mongo/:/data/db/
    networks:
      - mynetwork

  postgres:
    image: 'postgres:17.2'
    ports:
      - "5432:5432"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == node-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - ./database/postgres/:/var/lib/postgresql/data/
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay

volumes:
  caddy_data:
    external: true
  caddy_config:
    external: true
