apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-service
  template:
    metadata:
      labels:
        app: mail-service
    spec:
      containers:
      - name: mail-service
        image: viniciusgue/mail-service:1.0.0
        env:
          - name: MAIL_DOMAIN
            value: ""
          - name: MAIL_HOST
            value: mailhog
          - name: MAIL_PORT
            value: "1025"
          - name: MAIL_USERNAME
            value: ""
          - name: MAIL_PASSWORD
            value: ""
          - name: MAIL_ENCRYPTION
            value: none
          - name: MAIL_FROM_NAME
            value: Mail Service
          - name: MAIL_FROM_ADDRESS
            value: mail-service@localhost
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        ports:
        - containerPort: 9093

---

apiVersion: v1
kind: Service
metadata:
  name: mail-service
spec:
  selector:
    app: mail-service
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093
  type: NodePort
